name: SEO pass

# Re-applies tools/seo.py after every push, so pages regenerated by the
# content pipeline keep their canonical/OG/JSON-LD tags and the sitemap
# always lists every design.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo
  cancel-in-progress: true

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/seo.py
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "leewan-seo-bot"
            git config user.email "leewan-seo-bot@users.noreply.github.com"
            git add -A
            git commit -m "SEO pass (auto)"
            git pull --rebase origin main
            git push
          fi
